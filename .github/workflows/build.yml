name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号,例如 0.2.0(不带 v)。留空则用 dev-<短 commit>"
        required: false
        type: string
      release:
        description: "构建后发布 GitHub Release(需要填写版本号,会自动创建 v<版本号> tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP: dbmeta-cli
  PKG: dbmeta-cli/internal/cli

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            v="${INPUT_VERSION#v}"
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "非法版本号: $v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          name="${APP}_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X ${PKG}.Version=${VERSION}" \
            -o "dist/$name/${APP}${ext}" ./cmd/${APP}
          cp README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l

      - name: Smoke test (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tar -xzf "dist/${APP}_${VERSION}_linux_amd64.tar.gz" -C dist
          out="$(dist/${APP}_${VERSION}_linux_amd64/${APP} version)"
          echo "$out"
          echo "$out" | grep -q "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            echo "发布 Release 必须填写版本号" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
